name: CI

on:
  push:
    branches: [main, master, dev, develop]
  pull_request:
    branches: [main, master, dev, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Dependencies
        run: bun install

      - name: Typecheck Common
        run: bun --cwd common typecheck

      - name: Typecheck SDK
        run: bun --cwd sdk typecheck

      - name: Typecheck CLI
        run: bun --cwd cli typecheck

      - name: Run Tests
        run: |
          bun test cli/src
          bun test common/src

  build-matrix:
    name: Verify Binary Build (${{ matrix.os }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-latest
            platform: darwin-arm64
          - os: windows-latest
            platform: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Dependencies
        run: bun install

      - name: Build Binary
        shell: bash
        run: bun --cwd cli build:binary

      - name: Verify Binary Exists
        shell: bash
        run: |
          if [ -f "cli/bin/rivo" ] || [ -f "cli/bin/rivo.exe" ]; then
            echo "✅ Binary created successfully"
          else
            echo "❌ Binary not found"
            exit 1
          fi
