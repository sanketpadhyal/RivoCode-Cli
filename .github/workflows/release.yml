name: Release & Distribute

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type (patch, minor, major)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build-binaries:
    name: Build Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            artifact_name: rivo-linux-x64
            binary_path: cli/bin/rivo
          - os: ubuntu-latest
            target: linux-arm64
            artifact_name: rivo-linux-arm64
            binary_path: cli/bin/rivo
            override_target: bun-linux-arm64
            override_platform: linux
            override_arch: arm64
          - os: macos-latest
            target: darwin-arm64
            artifact_name: rivo-darwin-arm64
            binary_path: cli/bin/rivo
          - os: macos-latest
            target: darwin-x64
            artifact_name: rivo-darwin-x64
            binary_path: cli/bin/rivo
            override_target: bun-darwin-x64
            override_platform: darwin
            override_arch: x64
          - os: windows-latest
            target: win32-x64
            artifact_name: rivo-windows-x64.exe
            binary_path: cli/bin/rivo.exe
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Dependencies
        run: bun install

      - name: Build Binary
        shell: bash
        env:
          OVERRIDE_TARGET: ${{ matrix.override_target }}
          OVERRIDE_PLATFORM: ${{ matrix.override_platform }}
          OVERRIDE_ARCH: ${{ matrix.override_arch }}
        run: |
          bun --cwd cli build:binary

      - name: Package Binary & Native Dependencies
        shell: bash
        run: |
          mkdir -p dist-package
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp cli/bin/rivo.exe dist-package/${{ matrix.artifact_name }}
            if [ -f "cli/bin/tree-sitter.wasm" ]; then cp cli/bin/tree-sitter.wasm dist-package/; fi
            cd dist-package && 7z a ../${{ matrix.artifact_name }}.zip *
          else
            cp cli/bin/rivo dist-package/${{ matrix.artifact_name }}
            chmod +x dist-package/${{ matrix.artifact_name }}
            if [ -f "cli/bin/tree-sitter.wasm" ]; then cp cli/bin/tree-sitter.wasm dist-package/; fi
            cd dist-package && tar -czvf ../${{ matrix.artifact_name }}.tar.gz *
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-artifact
          path: |
            *.tar.gz
            *.zip

  create-release:
    name: Publish GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Publish to NPM
    needs: [create-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to NPM
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

